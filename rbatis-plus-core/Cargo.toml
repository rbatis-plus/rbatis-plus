[package]
name = "rbatis-plus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["rbatis", "orm", "mybatis-plus", "database", "sql"]
categories = ["database", "web-programming"]
documentation = "https://docs.rs/rbatis-plus-core"
readme = "../README.md"
publish = ["crates-io"]

[features]
default = []
# 缓存能力来自 rbatis-cache（执行器集成层 + CacheBackend SPI），
# 本 crate 仅做类型 re-export。
cache = ["dep:rbatis-cache"]

[dependencies]
rbatis = { workspace = true }
rbatis-cache = { workspace = true, optional = true }
rbs = { workspace = true }
rbdc = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
