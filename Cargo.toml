[workspace]
members = [
    "crates/rbatis-plus-core",
    "crates/rbatis-plus-extension",
    "crates/rbatis-plus-macros",
    "crates/rbatis-plus-generator",
    "crates/rbatis-plus-sqlparser",
    "crates/rbatis-plus-vernal",
]
resolver = "2"

[workspace.package]
version = "0.1.1-alpha.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["RBatis-Plus Contributors"]
description = "MyBatis-Plus equivalent enhancement framework for RBatis"
repository = "https://github.com/rbatis-plus/rbatis-plus"
homepage = "https://github.com/rbatis-plus/rbatis-plus"

[workspace.dependencies]
# 上游 ORM：本地开发用 file:// 指向本地 rbatis 仓库的
# fix/transaction-listener 分支（TransactionListener hook + apply_after
# 短路修复）。
# 切换时机：该分支 PR 合入 rbatis 上游并发布后，改为：
#   rbatis = { git = "https://github.com/rbatis-plus/rbatis.git", branch = "fix/transaction-listener" }
# 或 crates.io 版本。
rbatis = { git = "file:///Users/wandl/workspaces/workspace-github-easy-4-rust/rbatis", branch = "fix/transaction-listener" }
# 缓存扩展（执行器集成层 + CacheBackend SPI）。
rbatis-cache = { path = "../rbatis-cache" }
rbs = "4"
rbdc = "4.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
log = "0.4"
dashmap = "6"
Inflector = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
hex = "0.4"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
tempfile = "3"

# ── facade crate ──
[package]
name = "rbatis-plus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["rbatis", "orm", "mybatis-plus", "database", "sql"]
categories = ["database", "web-programming"]
documentation = "https://docs.rs/rbatis-plus"
readme = "README.md"
publish = ["crates-io"]

[dependencies]
rbatis-plus-core = { version = "=0.1.1-alpha.1", path = "crates/rbatis-plus-core" }
rbatis-plus-extension = { version = "=0.1.1-alpha.1", path = "crates/rbatis-plus-extension" }
rbatis-plus-macros = { version = "=0.1.1-alpha.1", path = "crates/rbatis-plus-macros" }
rbatis-plus-generator = { version = "=0.1.1-alpha.1", path = "crates/rbatis-plus-generator" }
rbatis-plus-sqlparser = { version = "=0.1.1-alpha.1", path = "crates/rbatis-plus-sqlparser" }
rbatis-plus-vernal = { version = "=0.1.1-alpha.1", path = "crates/rbatis-plus-vernal" }
rbatis = { workspace = true }
rbatis-cache = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
rbs = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
trybuild = "1"
rbatis-plus-core = { version = "=0.1.1-alpha.1", path = "crates/rbatis-plus-core" }
rbatis-plus-macros = { version = "=0.1.1-alpha.1", path = "crates/rbatis-plus-macros" }

[features]
default = []
cache = ["rbatis-plus-core/cache", "rbatis-plus-extension/cache", "dep:rbatis-cache"]
axum = ["rbatis-plus-vernal/axum"]
