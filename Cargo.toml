[workspace]
members = [
    "crates/rbatis-plus-core",
    "crates/rbatis-plus-extension",
    "crates/rbatis-plus-macros",
    "crates/rbatis-plus-generator",
    "crates/rbatis-plus-sqlparser",
    "crates/rbatis-plus-vernal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["RBatis-Plus Contributors"]
description = "MyBatis-Plus equivalent enhancement framework for RBatis"
repository = "https://github.com/rbatis/rbatis-plus"

[workspace.dependencies]
rbatis = { path = "../rbatis" }
rbs = "4"
rbdc = "4.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1.89"
log = "0.4"
dashmap = "6.1.0"
Inflector = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex = "1.13.1"
hex = "0.4"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
tempfile = "3.27.0"

# ── facade crate ──
[package]
name = "rbatis-plus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[dependencies]
rbatis-plus-core = { path = "crates/rbatis-plus-core" }
rbatis-plus-extension = { path = "crates/rbatis-plus-extension" }
rbatis-plus-macros = { path = "crates/rbatis-plus-macros" }
rbatis-plus-generator = { path = "crates/rbatis-plus-generator" }
rbatis-plus-sqlparser = { path = "crates/rbatis-plus-sqlparser" }
rbatis-plus-vernal = { path = "crates/rbatis-plus-vernal" }
rbatis = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
rbs = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
