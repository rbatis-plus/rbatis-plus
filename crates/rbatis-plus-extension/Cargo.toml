[package]
name = "rbatis-plus-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["rbatis", "orm", "mybatis-plus", "interceptor", "database"]
categories = ["database", "web-programming"]
documentation = "https://docs.rs/rbatis-plus-extension"
readme = "../../README.md"
publish = ["crates-io"]

[features]
default = []
cache = ["rbatis-plus-core/cache", "dep:rbatis-cache"]

[dependencies]
rbatis-plus-core = { version = "=0.1.1-alpha.1", path = "../rbatis-plus-core" }
rbatis-plus-sqlparser = { version = "=0.1.1-alpha.1", path = "../rbatis-plus-sqlparser" }
rbatis = { workspace = true }
rbatis-cache = { workspace = true, optional = true }
rbs = { workspace = true }
rbdc = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
dashmap = { workspace = true }

[dev-dependencies]
futures = "0.3"
