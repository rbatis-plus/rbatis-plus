[package]
name = "rbatis-plus-vernal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["rbatis", "orm", "mybatis-plus", "axum", "actix"]
categories = ["database", "web-programming"]
documentation = "https://docs.rs/rbatis-plus-vernal"
readme = "../README.md"
publish = ["crates-io"]

[features]
default = []
axum = ["dep:axum", "dep:serde_urlencoded"]
actix = ["dep:actix-web", "dep:serde_urlencoded"]

[dependencies]
rbatis = { workspace = true }
rbs = { workspace = true }
rbdc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rbatis-plus-core = { version = "=0.1.1-alpha.1", path = "../rbatis-plus-core" }
rbatis-plus-extension = { version = "=0.1.1-alpha.1", path = "../rbatis-plus-extension" }

# 共享 web 依赖（axum 或 actix feature 时启用）
serde_urlencoded = { version = "0.7", optional = true }

# axum 集成（feature = "axum"）
axum = { version = "0.8", optional = true }

# actix-web 集成（feature = "actix"）
actix-web = { version = "4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
